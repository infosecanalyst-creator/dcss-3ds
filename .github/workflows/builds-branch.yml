name: build-3dsx
# Builds the 3DS binary and publishes it to the `builds` branch (3dsx + logs + SOURCE_COMMIT)
# so it can be fetched without a local PC build.
on:
  push:
    branches: ["**", "!builds"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git python3 python3-yaml perl flex bison pkg-config libpng-dev zlib1g-dev build-essential ca-certificates >/dev/null
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Build
        run: bash ./build-3ds.sh 2>&1 | tee build.log; test -f out/3ds/crawl/crawl.3dsx
      - name: Build .cia (124 MB extended memory; for emulators and FBI)
        continue-on-error: true
        run: |
          git clone -q --depth 1 https://github.com/3DSGuy/Project_CTR /tmp/ctr
          make -C /tmp/ctr/makerom -j4 >/dev/null 2>&1 || make -C /tmp/ctr/makerom 2>&1 | tail -20
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          SRC=$(dirname "$(find . -name crawl.smdh | grep crawl-ref | head -1)")
          make -C "$SRC" TARGET_3DS=y cia 2>&1 | tee cia.log
          cp "$SRC/crawl.cia" crawl.cia
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp out/3ds/crawl/crawl.3dsx out/ 2>/dev/null || true
          cp crawl.cia cia.log out/ 2>/dev/null || true
          cp build.log build-3ds.log out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/SOURCE_COMMIT
      - name: Publish to builds branch
        if: always()
        run: |
          cd out
          git init -q -b builds
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add -A; git commit -qm "build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
